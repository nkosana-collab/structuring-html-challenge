<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Responsive Image</title>
    </head>
    <body>
        <header>
            <h1>Responsive Image Test</h1>
        </header>
        <main>
            <p>This image below changes depending of the devise screen it is being viewedd on.</p>
            <picture>
                <source media="(width < 800px)" srcset="portrait.jpg">
                <source media="(width >= 800px)" srcset="landscape.jpg">
                <img src="landscape.jpg" alt="Image of a lake house.">
            </picture>
        </main>
    </body>
</html>
